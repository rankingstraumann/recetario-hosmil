name: Deploy outbound-whatsapp-send

# OUTBOUND 7 (modo PRUEBA). Solo manual (workflow_dispatch): NO se despliega solo al hacer push.
# El kill switch OUTBOUND_WHATSAPP_ENABLED queda apagado hasta que se configure el secreto en Supabase.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout leads-outbound-v1-preview
        uses: actions/checkout@v4
        with:
          ref: leads-outbound-v1-preview

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy Supabase Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase@latest functions deploy outbound-whatsapp-send --project-ref gzimllusbxjorbsbtsse
